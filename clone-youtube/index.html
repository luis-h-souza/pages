<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Youtube Clone</title>
</head>

<body>
  <header class="fixed top-0 left-0 bg-white z-50 px-4 py-2 w-full flex justify-between items-center shadow-md">
    <div class="flex items-center gap-1">
      <button class="py-2 px-3 hover:bg-gray-300 rounded-full cursor-pointer">
        <i class="ri-menu-fill text-[24px]"></i>
      </button>

      <div class="flex items-center gap-1 cursor-pointer">
        <i class="ri-youtube-fill text-red-600 text-3xl"></i>
        <span class="text-xl font-semibold -tracking-wider">YouTube</span>
        <span class="text-[10px] text-gray-600">BR</span>
      </div>
    </div>

    <form class="max-w-2xl mx-4 flex flex-shirink grow-0 basis-[732px]">
      <input type="text"
        class="flex-1 border border-gray-300 rounded-l-full rounded-r-0 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 z-1"
        placeholder="Pesquisar" />
      <button
        class="bg-gray-100 border border-gray-300 rounded-r-full px-6 py-2 hover:bg-gray-200 hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
        <i class="ri-search-line text-xl"></i>
      </button>
      <button
        class="ml-2 px-3 py-2 bg-gray-200 hover:bg-gray-300 rounded-full cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500 text-xl">
        <i class="ri-mic-fill"></i>
      </button>
    </form>

    <div class="flex items-center gap-1">
      <button class="p-2 hover:bg-gray-300 rounded-full cursor-pointer px-3 py-2">
        <i class="ri-video-add-line text-xl"></i>
      </button>
      <button class="p-2 hover:bg-gray-300 rounded-full cursor-pointer px-3 py-2">
        <i class="ri-notification-3-line text-xl"></i>
      </button>
      <button
        class="mx-3 w-8 h-8 bg-purple-700 rounded-full text-white font-semibold flex items-center justify-center hover:brightness-80 cursor-pointer">
        <span>LH</span>
      </button>
    </div>
  </header>

  <div class="flex pt-14">
    <aside class="fixed left-0 top-14 w-60 bg-white overflow-y-auto py-6">
      <nav class="flex flex-col space-y-1">
        <a href="#" class="flex flex-items-center gap-4 ms-4 px-6 py-2 bg-gray-100 rounded-xl">
          <i class="ri-home-4-fill text-xl"></i>
          <span class="my-auto text-sm font-medium ">Início</span>
        </a>
        <a href="#" class="flex flex-items-center gap-4 ms-4 px-6 py-2 rounded-xl hover:bg-gray-100">
          <i class="ri-compass-3-line text-xl"></i>
          <span class="my-auto text-sm font-medium">Explorar</span>
        </a>
        <a href="#" class="flex flex-items-center gap-4 ms-4 px-6 py-2 rounded-xl hover:bg-gray-100">
          <i class="ri-play-list-2-line text-xl"></i>
          <span class="my-auto text-sm font-medium">Inscrições</span>
        </a>

        <hr class="mx-6 my-3 text-gray-200">

        <a href="#" class="flex flex-items-center gap-4 ms-4 px-6 py-2 rounded-xl hover:bg-gray-100">
          <i class="ri-history-line text-xl"></i>
          <span class="my-auto text-sm font-medium">Histórico</span>
        </a>
        <a href="#" class="flex flex-items-center gap-4 ms-4 px-6 py-2 rounded-xl hover:bg-gray-100">
          <i class="ri-time-line text-xl"></i>
          <span class="my-auto text-sm font-medium">Assistir mais tarde</span>
        </a>
        <a href="#" class="flex flex-items-center gap-4 ms-4 px-6 py-2 rounded-xl hover:bg-gray-100">
          <i class="ri-thumb-up-line text-xl"></i>
          <span class="my-auto text-sm font-medium">Vídeos Marcados</span>
        </a>

        <hr class="mx-6 my-3 text-gray-200">

        <h3 class="text-lg font-bold -tracking-wide ms-4 px-6 py-2">Inscrições</h4>
          <a href="#" class="flex flex-items-center gap-4 ms-4 px-6 py-2 rounded-xl hover:bg-gray-100">
            <div class="w-6 h-6 bg-red-500 rounded-full"></div>
            <span class="my-auto text-sm font-medium">Tech Chanel</span>
          </a>
          <a href="#" class="flex flex-items-center gap-4 ms-4 px-6 py-2 rounded-xl hover:bg-gray-100">
            <div class="w-6 h-6 bg-blue-500 rounded-full"></div>
            <span class="my-auto text-sm font-medium">Tech Space</span>
          </a>
          <a href="#" class="flex flex-items-center gap-4 ms-4 px-6 py-2 rounded-xl hover:bg-gray-100">
            <div class="w-6 h-6 bg-green-500 rounded-full"></div>
            <span class="my-auto text-sm font-medium">History</span>
          </a>
      </nav>
    </aside>

    <main class="flex-1 ml-60 p-6">
      <div class="flex gap-3 mb-6 overflow-x-auto py-2">
        <button class="px-3 py-1 bg-gray-900 text-white rounded-lg text-sm whitespace-nowrap">Tudo</button>
        <button
          class="px-3 py-1 bg-gray-100 text-black rounded-lg text-sm whitespace-nowrap hover:bg-gray-300  cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500">Música</button>
        <button
          class="px-3 py-1 bg-gray-100 text-black rounded-lg text-sm whitespace-nowrap hover:bg-gray-300  cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500">Filmes</button>
        <button
          class="px-3 py-1 bg-gray-100 text-black rounded-lg text-sm whitespace-nowrap hover:bg-gray-300  cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500">Culinária</button>
        <button
          class="px-3 py-1 bg-gray-100 text-black rounded-lg text-sm whitespace-nowrap hover:bg-gray-300  cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500">Programação</button>
        <button
          class="px-3 py-1 bg-gray-100 text-black rounded-lg text-sm whitespace-nowrap hover:bg-gray-300  cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500">Jogos</button>
        <button
          class="px-3 py-1 bg-gray-100 text-black rounded-lg text-sm whitespace-nowrap hover:bg-gray-300  cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500">Podcast</button>
        <button
          class="px-3 py-1 bg-gray-100 text-black rounded-lg text-sm whitespace-nowrap hover:bg-gray-300  cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500">Culinária</button>
      </div>

      <div class="grid grid-cols-4 gap-4" id="videos"></div>


    </main>

  </div>
</body>
<script>
  const videos = [
    { title: "Curso de HTML", channel: "Rodolfo Mori", time: "há 2 dias", duration: "10:32", views: "20 mil" },
    { title: "Introdução ao JavaScript", channel: "Dev Solitário", time: "há 1 semana", duration: "25:10", views: "200 mil" },
    { title: "Python para Iniciantes", channel: "Código Fonte TV", time: "há 3 dias", duration: "45:55", views: "100 mil" },
    { title: "CSS Grid na Prática", channel: "Filipe Deschamps", time: "há 1 mês", duration: "18:40", views: "90 mil" },
    { title: "React: Primeiros Passos", channel: "Rocketseat", time: "há 5 horas", duration: "1:12:30", views: "236 mil" },
    { title: "Backend com Node.js", channel: "Lucas Montano", time: "há 2 semanas", duration: "33:15", views: "170 mil" },
    { title: "Estrutura de Dados", channel: "Programação Dinâmica", time: "há 4 dias", duration: "22:05", views: "300 mil" },
    { title: "Unboxing do Novo TechPhone", channel: "TechMundo", time: "há 1 dia", duration: "12:45", views: "199 mil" },
    { title: "Viagem para o Japão", channel: "Viajante Anônimo", time: "há 3 semanas", duration: "15:20", views: "311 mil" },
    { title: "Receita de Bolo de Chocolate", channel: "Cozinha da Vovó", time: "há 6 dias", duration: "08:50", views: "210 mil" },
    { title: "Melhores Momentos da Live", channel: "GamerX", time: "há 12 horas", duration: "30:00", views: "260 mil" },
    { title: "Como fazer uma estante", channel: "Faça Você Mesmo", time: "há 1 mês", duration: "20:18", views: "389 mil" },
    { title: "Clipe Oficial - Nova Música", channel: "Banda Fictícia", time: "há 8 horas", duration: "04:12", views: "500 mil" },
  ];

  const container = document.getElementById('videos');

  videos.forEach((video, index) => {
    const videoCard = document.createElement('article');
    videoCard.className = 'cursor-pointer'
    videoCard.innerHTML = `
    <div class="relative bg-gray-200 rounded-xl overflow-hidden">
      <img src="https://picsum.photos/320/180?random=${index} class="w-full h-full object-cover">
      <span class="absolute bottom-2 right-2 bg-black opacity-80 text-white text-xs p-1 rounded">${video.duration}</span>
    </div>
    <div class="flex gap-3 mt-3">
      <div>
        <h3 class="font-medium text-base">${video.title}</h3>
        <p class="text-sm text-gray-600 mt-1">${video.channel}</p>
        <p class="text-sm text-gray-600">${video.views}</p>
      </div>
    </div>
    `
    container.appendChild(videoCard)
  });
</script>

</html>
